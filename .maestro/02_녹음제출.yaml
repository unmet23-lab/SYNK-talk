appId: lab.synk.talk
name: 녹음 → 확인 → 보내기 (앱의 급소)
env:
  학생번호: ${MAESTRO_학생번호}
  비밀번호: ${MAESTRO_비밀번호}
---
# 🔴 **이 흐름 하나가 Maestro 도입의 근거다.**
#   녹음은 `expo-audio` + 실기기 마이크 권한이 걸려 있어서, node 회귀로는 원리적으로 못 잡는다
#   (모킹하면 «내가 만든 가짜»를 재게 된다). 실제로 눌러 보는 것 말고 방법이 없다.
- runFlow: 01_인증.yaml

# ── 듣기 단계를 지난다 (편지가 있는 날에만 뜬다 — 없으면 그냥 넘어간다)
- runFlow:
    when:
      visible:
        id: "말하기-다들었어요"
    commands:
      - tapOn:
          id: "말하기-다들었어요"

- extendedWaitUntil:
    visible:
      id: "녹음-시작"
    timeout: 15000

- tapOn:
    id: "녹음-시작"

# 녹음 중 표시가 «실제로» 바뀌는지 본다 — 버튼은 눌렸는데 녹음이 안 시작되는 자리가 있다.
- assertVisible:
    id: "녹음-끝"

# 사람이 말하는 만큼 기다린다. 너무 짧으면 무발화로 떨어져 다른 가지를 타게 된다.
- waitForAnimationToEnd:
    timeout: 6000

- tapOn:
    id: "녹음-끝"

# ── 여기서 길이 둘로 갈린다 (실측 2026-08-16 · 에뮬레이터 첫 밟기에서 드러났다)
#   ㉠ 소리가 담긴 경우 → 확인 카드(`말하기-내목소리`) → 보내기
#   ㉡ 소리가 «없는» 경우 → 무발화 카드(「목소리가 안 담겼어요」)
#
# 🔴 에뮬레이터에는 실제 마이크 소리가 없어서 **항상 ㉡로 온다.** 앱은 그때 정확히 설계대로
#   다정하게 처리한다 — 그러니 ㉡도 실패가 아니라 «이 환경에서 잴 수 있는 전부»다.
#   ㉠까지 재려면 실기기가 필요하다(README 「환경이 가르는 것」).
#
# ⚠ 그래서 이 흐름의 «통과»는 두 뜻이다. 어느 쪽을 쟀는지는 실행 로그의 `Run flow when …`
#   줄이 말한다 — 통과만 보고 「제출까지 닿았다」로 읽지 않는다(분모 규칙).
- runFlow:
    when:
      visible:
        id: "말하기-내목소리"
    commands:
      - tapOn:
          id: "말하기-보내기"

# ㉡ 무발화 — 녹음 사이클이 «닫혔는지»까지가 이 환경의 과녁이다.
#   여기가 뜬다는 것 자체가 마이크 권한·녹음 시작·정지·판정이 다 돌았다는 뜻이다.
- runFlow:
    when:
      visible:
        id: "말하기-무발화-다시"
    commands:
      - tapOn:
          id: "말하기-무발화-다시"
      - extendedWaitUntil:
          visible:
            id: "녹음-시작"
          timeout: 15000

# 🔑 보낸 «뒤»를 안 재면 이 흐름은 절반이다 — 제출이 서버에 닿았는지는
#   `도착확인` 화면의 「못 보낸 것」 수가 증언한다(그 화면 머리말 참조).
#   그 단계는 화면 경로를 직접 확인한 뒤에 잇는다(아래 README 「아직 안 지은 것」).
