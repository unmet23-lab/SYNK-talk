appId: lab.synk.talk
name: 로그인 — 앱을 열고 학생이 들어간다
env:
  학생번호: ${MAESTRO_학생번호}
  비밀번호: ${MAESTRO_비밀번호}
---
# 🔴 이 흐름이 지키는 것: **앱이 뜨고 로그인이 통과한다.**
#   node 회귀는 이 자리를 원리적으로 못 잰다 — `tests/lib/화면세우기.js` 머리말이 스스로
#   못박았다(*expo-* 를 끌고 오는 화면은 아직 못 연다 … 그건 실기기 몫이다*).
- launchApp:
    clearState: true          # 키체인에 남은 세션을 지우고 «처음 여는 학생»으로 선다
    permissions:
      microphone: allow       # 권한 대화상자에서 멈추면 흐름이 통째로 죽는다

- assertVisible:
    id: "입력-학생번호"

- tapOn:
    id: "입력-학생번호"
- inputText: ${학생번호}

- tapOn:
    id: "입력-비밀번호"
- inputText: ${비밀번호}

- tapOn:
    id: "인증-제출"

# 🔑 로그인 통과의 **첫** 증거는 「인증 화면이 사라졌다」다. 이것을 따로 세우는 이유:
#   아래 녹음 손잡이 하나로만 재면 «로그인 실패»와 «화면 전환이 한 칸 다름»이 같은 실패로
#   보인다. 실제로 2026-08-16 첫 실행에서 그 둘이 안 갈려서, 통과한 로그인이 실패로 읽혔다.
- extendedWaitUntil:
    notVisible:
      id: "입력-학생번호"
    timeout: 20000

# 🔴 실측 2026-08-16 — 로그인 직후 말하기 화면은 **«듣기» 단계로 선다.** 편지를 다 듣기
#   전에는 녹음 손잡이가 아예 없다(그 자리엔 `말하기-다들었어요`가 있다).
#   이 흐름을 지은 판은 기기를 못 봐서 「로그인하면 바로 녹음이 뜬다」고 가정했다 —
#   `.maestro/README.md` 가 「첫 실행에서 고칠 자리가 나올 것」이라 적어둔 그 자리다.
- runFlow:
    when:
      visible:
        id: "말하기-다들었어요"
    commands:
      - tapOn:
          id: "말하기-다들었어요"

# 로그인이 끝나면 학생 앱의 동사는 하나다 — 말하기 화면이 선다(`App.js` 머리말).
- extendedWaitUntil:
    visible:
      id: "녹음-시작"
    timeout: 20000
