appId: lab.synk.talk
name: 교정 열람 → 답장 (재발화 통로)
env:
  학생번호: ${MAESTRO_학생번호}
  비밀번호: ${MAESTRO_비밀번호}
---
# 🔴 지키는 것: 교정이 온 학생이 그것을 **열고 답할 수 있다.**
#   답장 값은 계약이다(`src/교정API.js` → `학생응답값 = ['채택','무시','수정']`) — 그래서
#   손잡이도 카피가 아니라 그 코드값에서 짓는다. 카피가 바뀌어도 이 흐름은 안 깨진다.
- runFlow: 01_인증.yaml

# 교정이 없는 날에는 답장 링크 자체가 안 그려진다(`App.js`: 없으면 링크를 안 그린다).
# 그때 이 흐름은 **실패가 아니라 «잴 것이 없음»**이다 — 실행 도구가 그 구분을 보고한다.
- runFlow:
    when:
      visible:
        id: "답장-채택"
    commands:
      - tapOn:
          id: "답장-채택"
      # 누른 뒤 화면이 실제로 응답을 삼켰는지 — 버튼이 잠기거나 화면이 넘어가야 한다.
      - waitForAnimationToEnd:
          timeout: 5000
