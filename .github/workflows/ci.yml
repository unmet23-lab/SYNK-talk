name: CI

# 두 갈래로 나눈다:
#   verify — 자격증명이 없어도 항상 돈다. 지금 당장 값을 한다.
#   build  — **손으로 부를 때만**(workflow_dispatch). 아래 🔴 참조.
#
# 🔴 2026-08-06: build 를 push 게이트에서 뺐다. 원래 의도(위 5번째 줄)는 「빨간불로 남기지
#    않는다」였는데, EXPO_TOKEN 을 등록한 뒤 **무료 플랜 Android 빌드 월 한도가 소진되자**
#    `eas build` 가 제출 단계에서 실패해 push 마다 CI 가 빨개졌다(리셋 = 매월 1일).
#    주인 없이 남은 적색은 남의 배포 게이트를 막는다 — 그리고 이 빌드는 `--no-wait` 라
#    **초록이어도 「걸었다」까지만 뜻한다**(결과는 Expo 화면에서만 보인다).
#    즉 push 마다 크레딧을 태우면서 아무도 안 읽는 답을 만들고 있었다. 필요할 때 부른다:
#      gh workflow run CI --repo unmet23-lab/SYNK-talk   (또는 Actions 탭 → Run workflow)
#    ⚠ 되돌리려면 build 의 `if:` 한 줄만 지우면 된다.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 커밋 가드 회귀
        run: npm test
      - name: 교정 엔진 평가
        run: npm run eval

  build:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 손으로 부를 때만 도니 기다려도 된다 — 그래서 `--no-wait` 를 뺐다(아래 preview 스텝).
    # 상한을 두는 이유: 무료 플랜은 큐 우선순위가 낮아 대기가 길어질 수 있는데, 상한이 없으면
    # 잡이 기본 6시간을 문다. 90분을 넘긴다는 것 자체가 **「유료로 올릴 때가 됐다」는 신호**다.
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: EXPO_TOKEN 확인
        id: gate
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN 이 없어 빌드를 건너뛴다. 등록 절차는 docs/배포_경로.md 참조."
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.have == 'true'
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.have == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        if: steps.gate.outputs.have == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        if: steps.gate.outputs.have == 'true'

      # 토큰이 있어도 프로젝트가 EAS 에 연결돼 있지 않으면 빌드는 못 돈다 — 그리고 CI 는 그것을
      # 스스로 만들 수 없다(공식: CI 는 사전 링크된 프로젝트를 요구한다). 그 상태를 eas 의 낯선
      # 오류로 만나면 원인이 「토큰이 잘못됐나」로 오독된다. 무엇이 없는지 먼저 이름을 대고 멈춘다.
      - name: 프로젝트 링크 확인
        if: steps.gate.outputs.have == 'true'
        run: |
          node -e '
            const a = require("./app.json");
            const id = a.expo && a.expo.extra && a.expo.extra.eas && a.expo.extra.eas.projectId;
            if (!id) {
              console.error("::error::app.json 에 extra.eas.projectId 가 없다 — 이 앱은 아직 EAS 프로젝트와 연결되지 않았다. 토큰 문제가 아니다. 로컬에서 eas init 을 1회 돌려 나온 값을 커밋해야 한다(docs/배포_경로.md).");
              process.exit(1);
            }
            console.log("projectId=" + id);
          '

      # 커밋 해시를 앱 안으로 넣는다 — 「도착 확인 화면」이 이 값을 보여준다.
      # 이게 없으면 「밀었다」와 「도착했다」를 화면에서 구별할 수 없다.
      #
      # 🔴 `--no-wait` 를 **쓰지 않는다**(2026-08-06 제거). 그것을 붙이면 이 잡은 **제출에
      #    성공한 순간 초록**이 되고, 진짜 빌드 실패는 Expo 화면에만 남는다 — CI 는 영원히
      #    초록이라 **「빨간 것을 세어 수리한다」가 성립하지 않는다.** 손으로 부를 때만 도는
      #    잡이라 기다리는 비용은 월 1회 수준이다(위 timeout-minutes 참조).
      #    ⚠ 이 잡의 빨강은 두 원인이 같은 색이다 — **빌드 실패**(eas 가 비0으로 끝남)와
      #      **90분 초과**(잡이 끊김). 로그 끝 줄로 가른다: 전자는 eas 오류, 후자는 무음 중단.
      #    회귀 = tests/출시가드.test.js (`--no-wait` 부활 차단).
      - name: preview 빌드
        if: steps.gate.outputs.have == 'true'
        env:
          EXPO_PUBLIC_COMMIT: ${{ github.sha }}
        run: eas build --platform android --profile preview --non-interactive
