<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOPIK 문항 검수 — SYNK</title>
<!--
  검수 화면 (발전 트랙 ① · 유호 확정 08-14) — 판정은 lib/토픽퀴즈검수.js, 저장은 tools/문항검수.js.
  킷: 바탕 Navy2 #0F1730 · 글자 Cream #F6F1E8 · 보조 Slate #8A93AD · **신호 1점 = Coral #FF6B5C(정답 자리)**.
  Coral 면 위 글자는 Navy 2 만(철칙 ③). 순백·순검정 0. 이모지 0.
  속도가 이 화면의 값이다 — 100문항을 손이 아니라 키보드로 넘긴다(Enter 확정 · 1~4 범주 · R 반려).
-->
<style>
  :root {
    --navy2: #0F1730; --navy: #1A2340; --navy3: #2A3358;
    --cream: #F6F1E8; --cream3: #E7DDC7; --slate: #8A93AD;
    --coral: #FF6B5C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--navy2); color: var(--cream);
    font: 16px/1.6 "Pretendard", -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  header {
    width: 100%; border-bottom: 1px solid var(--navy3); padding: 14px 20px;
    display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap;
  }
  h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: .01em; }
  .분모 { color: var(--slate); font-size: 13px; font-variant-numeric: tabular-nums; }
  .분모 b { color: var(--cream); font-weight: 600; }
  main { width: 100%; max-width: 720px; padding: 28px 20px 64px; }

  .진행 { height: 4px; background: var(--navy3); border-radius: 2px; overflow: hidden; margin-bottom: 26px; }
  .진행 i { display: block; height: 100%; background: var(--coral); width: 0; transition: width 180ms ease; }

  .머리 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .id { color: var(--slate); font-size: 13px; font-variant-numeric: tabular-nums; }
  .스킬 { color: var(--cream3); font-size: 13px; }
  .지시문 { color: var(--slate); font-size: 14px; margin: 0 0 10px; }
  .질문 { font-size: 27px; font-weight: 600; line-height: 1.45; margin: 0 0 22px; word-break: keep-all; }

  ol.보기 { list-style: none; margin: 0 0 26px; padding: 0; display: grid; gap: 8px; }
  ol.보기 li {
    border: 1px solid var(--navy3); border-radius: 10px; padding: 12px 14px;
    display: flex; gap: 12px; align-items: center; font-size: 18px;
  }
  ol.보기 li .번호 { color: var(--slate); font-size: 13px; font-variant-numeric: tabular-nums; min-width: 1.2em; }
  ol.보기 li.정답 { background: var(--coral); border-color: var(--coral); color: var(--navy2); font-weight: 700; }
  ol.보기 li.정답 .번호 { color: var(--navy2); opacity: .75; }
  ol.보기 li.정답 .표 { margin-left: auto; font-size: 12px; letter-spacing: .06em; }

  .절제목 { font-size: 12px; color: var(--slate); letter-spacing: .08em; margin: 0 0 8px; }
  .범주들 { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .범주 {
    border: 1px solid var(--navy3); background: transparent; color: var(--cream);
    border-radius: 999px; padding: 9px 15px; font: inherit; font-size: 14px; cursor: pointer;
    min-height: 40px; transition: border-color 140ms ease, background 140ms ease;
  }
  .범주:hover { border-color: var(--slate); }
  .범주[aria-pressed="true"] { background: var(--navy3); border-color: var(--cream3); font-weight: 600; }
  .범주 kbd { color: var(--slate); font-size: 11px; margin-left: 6px; font-family: inherit; }
  .범주문구 { color: var(--slate); font-size: 13px; min-height: 1.6em; margin: 0 0 22px; }

  .단추들 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button.주 {
    background: var(--coral); color: var(--navy2); border: 0; border-radius: 10px;
    padding: 13px 26px; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; min-height: 44px;
  }
  button.보조 {
    background: transparent; color: var(--cream); border: 1px solid var(--navy3);
    border-radius: 10px; padding: 13px 20px; font: inherit; font-size: 15px; cursor: pointer; min-height: 44px;
  }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, .범주:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
  .힌트 { color: var(--slate); font-size: 12px; margin-left: auto; }

  .상태 { margin-top: 20px; font-size: 14px; color: var(--cream3); min-height: 1.6em; }
  .상태.나쁨 { color: var(--coral); }
  .끝 { text-align: center; padding: 60px 0; }
  .끝 p { color: var(--slate); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } button:active { transform: none; } }
</style>
</head>
<body>
<header>
  <h1>TOPIK 문항 검수</h1>
  <span class="분모" id="분모">불러오는 중</span>
</header>
<main>
  <div class="진행"><i id="진행"></i></div>
  <div id="판"></div>
  <p class="상태" id="상태"></p>
</main>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
let 재료 = null, 대기 = [], 지금문항 = null, 고른범주 = null, 보냄 = false;

const 다듬 = (s) => String(s == null ? '' : s);
function 글자(부모, 태그, 값, 클래스) {
  const el = document.createElement(태그);
  if (값 != null) el.textContent = 값;      // 문항 문구는 언제나 텍스트로 — 화면에 마크업을 안 만든다
  if (클래스) el.className = 클래스;
  부모.appendChild(el);
  return el;
}

async function 불러오기() {
  const r = await fetch('/api/data');   // 경로는 ASCII — 한글 경로는 퍼센트 인코딩으로 어긋난다
  재료 = await r.json();
  // 아직 «유효 확정»이 아닌 것만 줄 세운다 — 낡음(문구 수정분)도 여기 다시 들어온다
  대기 = 재료.문항들.filter((q) => q.사유 !== null);
  분모그리기();
  다음();
}

function 분모그리기() {
  const d = 재료.분모;
  $('분모').innerHTML = '';
  const 문 = `팩 ${d.팩} = 송출가능 ${d.송출가능} + 남음 ${d.팩 - d.송출가능}`;
  const b = document.createElement('b'); b.textContent = 문;
  $('분모').appendChild(b);
  $('진행').style.width = (d.팩 ? (d.송출가능 / d.팩) * 100 : 0) + '%';
}

function 다음() {
  지금문항 = 대기.shift() || null;
  고른범주 = null;
  그리기();
}

function 그리기() {
  const 판 = $('판');
  판.textContent = '';
  if (!지금문항) {
    const 끝 = 글자(판, 'div', null, '끝');
    글자(끝, 'h2', '이번 판은 다 봤습니다');
    글자(끝, 'p', `송출가능 ${재료.분모.송출가능} / 팩 ${재료.분모.팩} · 반려한 문항은 문구를 고친 뒤 다시 뜹니다`);
    return;
  }
  const q = 지금문항;
  const 머리 = 글자(판, 'div', null, '머리');
  글자(머리, 'span', q.문항id + (q.사유 === '낡음' ? ' · 문구가 바뀌어 재검수' : ''), 'id');
  글자(머리, 'span', q.스킬.join(' · '), '스킬');
  글자(판, 'p', q.지시문, '지시문');
  글자(판, 'p', q.질문, '질문');

  const 보기 = 글자(판, 'ol', null, '보기');
  q.보기.forEach((b, i) => {
    const li = 글자(보기, 'li', null, b.option_id === q.정답 ? '정답' : '');
    글자(li, 'span', String(i + 1), '번호');
    글자(li, 'span', b.label);
    if (b.option_id === q.정답) 글자(li, 'span', '정답', '표');
  });

  글자(판, 'p', '오답이 죽는 이유 — 화면에 나갈 한 벌 문구가 여기서 갈립니다', '절제목');
  const 범주들 = 글자(판, 'div', null, '범주들');
  재료.범주표.forEach((c, i) => {
    const b = 글자(범주들, 'button', c.범주, '범주');
    글자(b, 'kbd', String(i + 1));
    b.setAttribute('aria-pressed', 'false');
    b.onclick = () => 범주고르기(c.범주);
  });
  글자(판, 'p', '', '범주문구');

  const 단추 = 글자(판, 'div', null, '단추들');
  const 확정 = 글자(단추, 'button', '확정', '주');
  확정.id = '확정'; 확정.onclick = () => 보내기('확정');
  const 반려 = 글자(단추, 'button', '반려', '보조');
  반려.onclick = () => 보내기('반려');
  const 건너 = 글자(단추, 'button', '건너뛰기', '보조');
  건너.onclick = () => { 대기.push(지금문항); 다음(); };
  글자(단추, 'span', 'Enter 확정 · 1~4 범주 · R 반려 · S 건너뛰기', '힌트');

  범주고르기(q.칸 && q.칸.범주 ? q.칸.범주 : q.초안);   // 초안을 미리 눌러 둔다 — 사람 손은 확정 하나
}

function 범주고르기(범주) {
  고른범주 = 범주;
  const 문구 = (재료.범주표.find((c) => c.범주 === 범주) || {}).문구_ko || '';
  document.querySelectorAll('.범주').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.firstChild && b.firstChild.textContent === 범주));
  });
  const p = document.querySelector('.범주문구');
  if (p) p.textContent = 문구 ? `학생 화면: “${문구}”` : '범주를 고르면 확정할 수 있습니다';
  const 확정 = $('확정');
  if (확정) 확정.disabled = !범주;
}

async function 보내기(판정) {
  if (!지금문항 || 보냄) return;
  if (판정 === '확정' && !고른범주) { 알림('범주를 먼저 고르세요', true); return; }
  let 사유 = '';
  if (판정 === '반려') {
    사유 = prompt('반려 사유 (예: 보기 둘이 자연스럽다)') || '';
    if (!사유.trim()) return;
  }
  보냄 = true;
  try {
    const r = await fetch('/api/verdict', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ 문항id: 지금문항.문항id, 판정, 범주: 고른범주, 사유 }),
    });
    const 답 = await r.json();
    if (!답.ok) throw new Error(답.오류 || '저장 실패');
    재료.분모 = 답.분모;
    분모그리기();
    알림(`${지금문항.문항id} ${판정} · 남음 ${재료.분모.팩 - 재료.분모.송출가능}`, false);
    다음();
  } catch (e) {
    // 저장이 실패했는데 다음 문항으로 넘어가면 그 판정은 «조용히» 사라진다 — 멈추고 알린다
    알림('저장 실패 — 넘어가지 않았습니다: ' + e.message, true);
  } finally { 보냄 = false; }
}

function 알림(문구, 나쁨) {
  const el = $('상태');
  el.textContent = 다듬(문구);
  el.className = '상태' + (나쁨 ? ' 나쁨' : '');
}

document.addEventListener('keydown', (e) => {
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === 'Enter') { e.preventDefault(); 보내기('확정'); return; }
  if (/^[1-4]$/.test(e.key)) {
    const c = 재료 && 재료.범주표[Number(e.key) - 1];
    if (c) 범주고르기(c.범주);
    return;
  }
  if (e.key === 'r' || e.key === 'R') { 보내기('반려'); return; }
  if (e.key === 's' || e.key === 'S') { if (지금문항) { 대기.push(지금문항); 다음(); } }
});

불러오기().catch((e) => 알림('재료를 못 불러왔습니다: ' + e.message, true));
</script>
</body>
</html>
